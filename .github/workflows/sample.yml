name: Build and deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  APP_NAME: "Total WAT NEXT"
  SCRIPT_DIR: ./scripts/blt-gitlab-pipelines
  PHP_VERSION: "8.2"
  NODE_VERSION: "20.x"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v1
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # - name: Remove vendor directory
      #   run: rm -rf vendor

      - name: Validate composer.json
        run: composer validate --no-check-all --ansi

      - name: Install composer dependencies (no dev)
        run: composer install --no-dev --optimize-autoloader

      - name: Install Acquia CLI
        run: |
          curl -fsSL https://github.com/acquia/cli/releases/latest/download/acli.phar -o /usr/local/bin/acli
          chmod +x /usr/local/bin/acli
      - name: Authenticate with Acquia Cloud
        env:
          ACQUIA_API_KEY: ${{ secrets.ACQUIA_API_KEY }}
          ACQUIA_API_SECRET: ${{ secrets.ACQUIA_API_SECRET }}
        run: |
          acli auth:login --key "$ACQUIA_API_KEY" --secret "$ACQUIA_API_SECRET"

      - name: Deploy to Acquia Cloud
        env:
          ACQUIA_SITE_UUID: ${{ secrets.ACQUIA_SITE_UUID }}
        run: |
          # Replace with your actual Acquia deployment command
          # Example: Push code to Acquia Cloud environment
          acli push "$ACQUIA_SITE_UUID" --yes

      

      
